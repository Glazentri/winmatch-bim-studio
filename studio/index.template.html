 const work=el("div","work"),p=el("section","panel"),h=el("div","panel-head");h.append(el("h2","","Visual module grid"),el("small","",c.widths.length+" columns × "+c.heights.length+" rows"));p.append(h);const b=el("div","detail-body"),st=el("div","stats");st.style.gridTemplateColumns="repeat(2,minmax(0,1fr))";
 for(const [l,v] of [["Overall width / height",fmt(t.widthMm)+" × "+fmt(t.heightMm)],["Gross area",fmt(t.areaM2,2)+" m²"],["Modules",t.panels.length],["Grid mullions",fmt(t.internalMullionLm,2)+" lm"]]){const a=el("div","stat");a.append(el("label","",l),el("div","num",v));st.append(a)}b.append(st);
 const view=el("div","preview curtain-preview"),scale=Math.min(480/t.widthMm,360/t.heightMm),w=t.widthMm*scale,hgt=t.heightMm*scale,x=(520-w)/2,y=35;let svg='<svg viewBox="0 0 520 440" xmlns="http://www.w3.org/2000/svg" aria-label="Curtain wall module grid" role="img"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+hgt+'" fill="none" stroke="currentColor" stroke-width="4"/>';

 svg+='<text x="260" y="'+(y+hgt+25)+'" text-anchor="middle" fill="currentColor" font-size="12">'+fmt(t.widthMm)+' mm · '+fmt(t.heightMm)+' mm high</text></svg>';view.innerHTML=svg;view.querySelectorAll("[data-cell]").forEach(g=>{g.onclick=()=>{cwSelected=g.dataset.cell;render()};g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();g.onclick()}}});b.append(view,el("p","help","Click a module to assign its panel type. Perimeter frame estimate: "+fmt(t.perimeterLm,2)+" lm."));p.append(b);

function sitePage(){const m=$("main"),s=current.siteContext;
 m.append(head("Site climate & orientation","Explore seasonal solar paths against the project orientation and record site-specific wind observations.",[button("Export site profile",()=>download(fileName()+"-site-climate.json",JSON.stringify(s,null,2)),"primary","export")]));
 m.append(banner(s.locationConfirmed?"Location marked as confirmed by the user. Solar paths use approximate solstice declination and local solar time; wind directions are manual, not forecast or measured data.":"Confirm latitude and orientation first. Coordinates may be uninitialised or derived from model settings. Wind values are manual illustrative inputs."));
 const work=el("div","work"),p=el("section","panel"),h=el("div","panel-head");h.append(el("h2","","Solar compass"),el("small","","True-north reference"));p.append(h);const body=el("div","detail-body");
 const coord=(az,alt)=>{const ang=(az-s.northBearing)*Math.PI/180,r=(90-alt)/90*145;return [190+Math.sin(ang)*r,190-Math.cos(ang)*r]};
 let svg='<svg viewBox="0 0 380 380" role="img" aria-label="Seasonal solar path compass" xmlns="http://www.w3.org/2000/svg">';
 for(const r of [145,97,48])svg+='<circle cx="190" cy="190" r="'+r+'" stroke="#8ba9a5" stroke-opacity=".6" fill="none"/>';
 for(const [a,l] of [[0,"N"],[90,"E"],[180,"S"],[270,"W"]]){const [x,y]=coord(a,-10);svg+='<text x="'+x+'" y="'+(y+5)+'" font-size="13" font-weight="700" text-anchor="middle" fill="currentColor">'+l+'</text>'}
 const declination=s.latitude<0?-23.44:23.44;for(const [d,color] of [[declination,"#d99d36"],[-declination,"#168f9a"]]){const points=[];for(let h=0;h<=24;h+=.1){const pos=W.solarPosition(s.latitude,d,h);if(pos.altitude>=0)points.push(coord(pos.azimuth,pos.altitude).join(","))}svg+='<polyline points="'+points.join(" ")+'" fill="none" stroke="'+color+'" stroke-width="3" stroke-linecap="round"/>';const pos=W.solarPosition(s.latitude,d,12),[x,y]=coord(pos.azimuth,Math.max(0,pos.altitude));if(pos.altitude>=0)svg+='<circle cx="'+x+'" cy="'+y+'" r="5" fill="'+color+'"/>'}
 for(const [az,color,lab] of [[s.summerWind,"#d99d36","Summer"],[s.winterWind,"#168f9a","Winter"]]){const [x,y]=coord(az,2),[x2,y2]=coord(az,28);svg+='<path d="M'+x+' '+y+' L'+x2+' '+y2+'" stroke="'+color+'" stroke-width="3" stroke-dasharray="4 3"/><circle cx="'+x2+'" cy="'+y2+'" r="4" fill="'+color+'"/>'}
 svg+='<circle cx="190" cy="190" r="5" fill="currentColor"/></svg>';const comp=el("div","preview site-compass");comp.innerHTML=svg;body.append(comp,el("p","help","Amber: summer solstice path and manual summer wind. Teal: winter solstice path and manual winter wind. Zenith is the centre; horizon is the outer circle. Dashed lines indicate wind direction of origin, not speed."));p.append(body);
 const settings=el("section","panel"),sh=el("div","panel-head");sh.append(el("h2","","Site inputs"));settings.append(sh);const sb=el("div","detail-body");
 for(const [k,label,min,max] of [["latitude","Latitude (°)",-89.9,89.9],["longitude","Longitude (°)",-180,180],["northBearing","Model up bearing from true north (°)",0,360],["summerWind","Summer wind from bearing (°)",0,360],["winterWind","Winter wind from bearing (°)",0,360]])sb.append(numeric(label,s[k],v=>{if(v!==null)s[k]=v;render()},{min,max}));
 const conf=el("label","check-setting"),check=el("input");check.type="checkbox";check.checked=s.locationConfirmed;check.onchange=()=>{s.locationConfirmed=check.checked;render()};conf.append(check,el("span","","Location and bearing confirmed"));sb.append(conf);
 const label=el("label","setting","Site notes");const i=el("textarea");i.value=s.siteNotes;i.onchange=()=>s.siteNotes=i.value;label.append(i);sb.append(label);for(const [d,lab] of [[declination,"Summer noon altitude"],[-declination,"Winter noon altitude"]])sb.append(el("div","metric",lab+": "+fmt(W.solarPosition(s.latitude,d,12).altitude,1)+"°"));settings.append(sb);work.append(p,settings);m.append(work)
}

 const bb=el("section","panel");bb.style.marginTop="15px";const bh=el("div","panel-head");bh.append(el("h2","","Bluebeam take-off import"));bb.append(bh);const bd=el("div","detail-body");bd.append(el("p","help","Export a Revu CSV markup summary with Subject, Label, Count, Width, Height, Page Label and Comments. Width/height must be explicit mm. This launches a separate snapshot; source row-derived IDs are not BIM GUIDs."));
